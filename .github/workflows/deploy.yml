name: Deploy Angular to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # INYECTAR LAS CREDENCIALES DE TELEGRAM EN UN ARCHIVO DE ENTORNO ANTES DE COMPILAR
      - name: Inject Environment Variables
        run: |
          echo "export const environment = { production: true, telegramBotToken: '${{ secrets.TELEGRAM_BOT_TOKEN }}', telegramChatId: '${{ secrets.TELEGRAM_CHAT_ID }}' };" > src/environments/environment.prod.ts

      - name: Build Project
        run: npm run build -- --configuration production

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/future-webs/browser # Ajusta la ruta de salida de tu build de Angular