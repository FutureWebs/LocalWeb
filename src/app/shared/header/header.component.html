<header class="header-container">
  <div class="logo">FUTURE</div>
  <div class="actions">
    <button class="btn-lang" [title]="'HEADER.CHANGE_LANG' | translate" (click)="toggleLang()">
      <i class="pi pi-language"></i>
    </button>
    <button
      type="button"
      class="header__control-btn"
      (click)="toggleTheme($event)"
      [title]="'HEADER.TOGGLE_THEME' | translate">
      <i [class]="currentThemeIcon"></i>
    </button>

    <button class="btn-contact" [title]="'HEADER.CONTACT' | translate">
      <i class="pi pi-envelope"></i>
    </button>
  </div>
</header>
