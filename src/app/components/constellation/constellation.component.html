<div class="constellation" #root>
  <svg
    class="constellation__sky constellation__dust-layer"
    #dustLayer
    viewBox="0 0 100 100"
    preserveAspectRatio="xMidYMid meet"
    aria-hidden="true"
  >
    @for (dot of dust; track dot.id) {
      <circle class="constellation__dust" [attr.cx]="dot.x" [attr.cy]="dot.y" [attr.r]="dot.r" />
    }
  </svg>

  <svg class="constellation__sky" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    @for (line of lines(); track line.id) {
      <line
        class="constellation__line"
        [attr.data-from]="line.a"
        [attr.data-to]="line.b"
        [attr.x1]="line.x1"
        [attr.y1]="line.y1"
        [attr.x2]="line.x2"
        [attr.y2]="line.y2"
      />
    }
  </svg>

  @for (node of nodes(); track node.id) {
    <span
      class="star-anchor"
      [style.left.%]="node.pos.x"
      [style.top.%]="node.pos.y"
      [style.--accent]="node.accent"
      [style.--k]="node.k"
    >
      <button
        class="star"
        type="button"
        (click)="travelTo(node, $event)"
        (mouseenter)="onStarEnter(node, $event)"
        (mouseleave)="onStarLeave(node, $event)"
        [attr.aria-label]="translator.pick(node.label)"
      >
        <span class="star__ring" aria-hidden="true"></span>
        <span class="star__spark" aria-hidden="true">
          <svg viewBox="-12 -12 24 24">
            <path
              d="M0,-10 C1.4,-3.8 3.8,-1.4 10,0 C3.8,1.4 1.4,3.8 0,10 C-1.4,3.8 -3.8,1.4 -10,0 C-3.8,-1.4 -1.4,-3.8 0,-10 Z"
              [attr.fill]="node.accent"
            />
          </svg>
        </span>
        <span class="star__core"></span>
        <span class="star__label">{{ translator.pick(node.label) }}</span>
        <span class="star__hint">{{ translator.pick(node.hint) }}</span>
      </button>
    </span>
  }
</div>
