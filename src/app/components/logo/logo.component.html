<span class="logo">
  <svg class="logo__mark" viewBox="-12 -12 24 24" aria-hidden="true">
    <defs>
      <linearGradient id="fw-logo-grad" x1="0" y1="-1" x2="1" y2="1">
        <stop offset="0%" stop-color="var(--c-violet)" />
        <stop offset="100%" stop-color="var(--c-cyan)" />
      </linearGradient>
    </defs>
    <path
      d="M0,-10 C1.4,-3.8 3.8,-1.4 10,0 C3.8,1.4 1.4,3.8 0,10 C-1.4,3.8 -3.8,1.4 -10,0 C-3.8,-1.4 -1.4,-3.8 0,-10 Z"
      fill="url(#fw-logo-grad)"
    />
    <circle r="2.2" fill="var(--c-white)" />
  </svg>
  <span class="logo__text">{{ name }}</span>
</span>
